<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SNK MEETS 2026 トーナメント管理</title>
<style>
  :root{
    --navy:#0b1430;
    --panel:#121d42;
    --panel2:#17234e;
    --blue:#007ADA;
    --blue-light:#4db2ff;
    --gold:#ffd60a;
    --win:#22c55e;
    --lose:#64748b;
    --text:#f2f5fb;
    --sub:#9fb0d0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--navy);color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;}

  #bgArt{position:fixed;inset:0;z-index:0;
    background-image:url("assets/ff-cotw-bg.jpg");background-size:cover;background-position:center;
    filter:blur(5px) brightness(.62) saturate(1.15);transform:scale(1.06);}
  #bgArt::after{content:"";position:absolute;inset:0;background:rgba(11,20,48,.38);}

  #app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

  header{padding:14px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--blue);
    background:linear-gradient(90deg,#ffffff 0%,#007ADA 100%);}
  header img.logo{height:44px;width:auto;flex-shrink:0;cursor:pointer;}
  header img.ff-logo{cursor:default;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4));}

  main{flex:1;padding:16px;max-width:1400px;margin:0 auto;width:100%;}

  /* ---- setup screen ---- */
  .card{background:var(--panel);border:1px solid #223063;border-radius:14px;
    padding:18px;margin-bottom:16px;}
  .card h2{margin:0 0 12px;font-size:1.02rem;color:var(--blue-light);}
  .count-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .count-btn{flex:1;min-width:70px;padding:14px 8px;border-radius:10px;border:2px solid #2b3a74;
    background:var(--panel2);color:var(--text);font-size:1.05rem;font-weight:700;cursor:pointer;}
  .count-btn.active{border-color:var(--gold);background:#2a2608;color:var(--gold);}

  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:14px;}
  .team-grid input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #2b3a74;
    background:#0e1838;color:var(--text);font-size:.92rem;}
  .team-grid input:focus{outline:2px solid var(--blue-light);}

  .toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:.88rem;color:var(--sub);}
  .toggle-row input{width:18px;height:18px;}

  .btn{display:inline-block;padding:12px 22px;border-radius:10px;border:none;
    font-size:.95rem;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-ghost{background:transparent;color:var(--sub);border:1px solid #2b3a74;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  /* ---- bracket screen ---- */
  #bracketScreen{display:none;}

  #champion{display:none;text-align:center;padding:16px 60px;margin:0 auto 6px;
    max-width:900px;min-height:240px;box-sizing:border-box;
    flex-direction:column;align-items:center;justify-content:center;
    background-image:url("assets/champion-banner.png");
    background-size:100% 100%;background-position:center;background-repeat:no-repeat;}
  #champion .label{font-size:.78rem;color:var(--gold);letter-spacing:.12em;}
  #champion .name{font-size:1.7rem;font-weight:800;color:#fff;margin-top:4px;}

  .pyramid-scroll{overflow-x:auto;overflow-y:hidden;padding:4px 0 20px;}
  #pyramidOuter{margin:0 auto;}
  .pyramid-wrap{position:relative;transform-origin:top left;}
  .pyramid-wrap svg{position:absolute;left:0;top:0;pointer-events:none;}

  .leaf-panel{position:absolute;
    background-image:url("assets/team-frame.png");
    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;
    padding:11px 14px 9px;transition:opacity .4s;}
  .leaf-panel .lname{font-size:.72rem;font-weight:700;text-align:center;line-height:1.15;
    word-break:break-all;color:#fff;
    text-shadow:0 0 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.8), 0 1px 2px rgba(0,0,0,1);}
  .leaf-panel.eliminated .lname{color:#9aa0b4;}
  .leaf-panel.champion-panel{box-shadow:0 0 14px 2px rgba(255,214,10,.5);}

  .badge{position:absolute;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9), 0 1px 2px rgba(0,0,0,1);
    background-image:url("assets/team-badge-frame.png");
    background-size:100% 100%;background-position:center;background-repeat:no-repeat;
    filter:drop-shadow(0 0 3px rgba(0,0,0,.85)) drop-shadow(0 0 7px rgba(0,0,0,.6));
    transition:filter .4s, box-shadow .4s, opacity .4s;}
  .badge.clickable{cursor:pointer;}
  .badge.placeholder{background-color:transparent;background-image:none;color:transparent;filter:none;}
  .badge.advanced{}
  .badge.eliminated{filter:grayscale(1) brightness(.5);opacity:.45;cursor:default;box-shadow:none;}
  .badge.champion-badge{}

  @keyframes flare{
    0%{ transform:translate(-50%,-50%) scale(.4); box-shadow:0 0 0 0 rgba(255,214,10,0); }
    45%{ transform:translate(-50%,-50%) scale(1.3); box-shadow:0 0 34px 12px rgba(255,214,10,1); }
    100%{ transform:translate(-50%,-50%) scale(1); }
  }
  .badge.flare{animation:flare .85s ease-out;}

  @keyframes championArrive{
    0%{ transform:translate(-50%,-50%) scale(.3); opacity:0; }
    60%{ transform:translate(-50%,-50%) scale(1.18); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1); }
  }
  .badge.champion-arrive{animation:championArrive .85s ease-out;}


  footer{text-align:center;padding:14px;font-size:.72rem;color:#51608c;}

</style>
</head>
<body>
<div id="bgArt"></div>
<div id="app">
  <header>
    <img class="logo" src="assets/snk-meets-2026-logo.png" alt="SNK MEETS 2026 — タップで再設定" id="logoResetBtn">
    <img class="logo ff-logo" src="assets/ff-cotw-logo.png" alt="FATAL FURY 餓狼伝説 City of the Wolves">
  </header>

  <main>
    <!-- ===== SETUP SCREEN ===== -->
    <div id="setupScreen">
      <div class="card">
        <h2>① チーム数を選択</h2>
        <div class="count-row" id="countRow"></div>
      </div>

      <div class="card">
        <h2>② チーム名を確認・編集（空欄可）</h2>
        <div class="team-grid" id="teamGrid"></div>
        <label class="toggle-row">
          <input type="checkbox" id="randomToggle" checked>
          組み合わせをランダムにする（オフにすると入力順のまま配置）
        </label>
        <div class="btn-row">
          <button class="btn btn-primary" id="startBtn">トーナメント開始</button>
        </div>
      </div>
    </div>

    <!-- ===== BRACKET SCREEN ===== -->
    <div id="bracketScreen">
      <div id="champion">
        <div class="label">CHAMPION</div>
        <div class="name" id="championName">-</div>
      </div>

      <div class="pyramid-scroll">
        <div id="pyramidOuter">
          <div class="pyramid-wrap" id="pyramid"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>GA Solutions — SNK MEETS 2026 Tournament Tool</footer>
</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "snkMeets2026BracketState";

  var state = {
    screen: "setup",
    teamCount: 8,
    teamNames: [],
    round0Slots: [],
    winners: {}
  };
  var lastFlareKeys = {}; // winners-dict keys seen at the previous render, to only flare NEW decisions

  function defaultName(i){ return String.fromCharCode(65 + i) + "チーム"; }
  function buildDefaultNames(count){ var arr=[]; for(var i=0;i<count;i++) arr.push(defaultName(i)); return arr; }
  function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function nextPow2(n){ var p=1; while(p<n) p*=2; return p; }
  function teamHue(i, total){ return Math.round((i * (360/total)) % 360); }

  // Byes are spread evenly across the whole bracket (not clustered in the first few matches),
  // so no single branch gets a disproportionate free ride to the later rounds.
  function buildRound0Slots(teamsOrder, bracketSize){
    var totalPairs = bracketSize / 2;
    var byes = bracketSize - teamsOrder.length;
    var byePairSet = {};
    for(var i=0;i<byes;i++){
      var pairIdx = Math.floor(i * totalPairs / byes);
      byePairSet[pairIdx] = true;
    }
    var slots = new Array(bracketSize).fill(null);
    var idx = 0;
    for(var p=0;p<totalPairs;p++){
      if(byePairSet[p]){
        slots[2*p] = teamsOrder[idx++];
        slots[2*p+1] = null;
      } else {
        slots[2*p] = teamsOrder[idx++];
        slots[2*p+1] = teamsOrder[idx++];
      }
    }
    return slots;
  }

  // rounds[r][m] = {a,b,winner}. winners dict key "r_m".
  // IMPORTANT: a/b/winner use three distinct states:
  //   a real name (string)  = a team occupies this slot
  //   null                  = this slot is structurally empty forever (bracket padding / true bye)
  //   undefined             = not decided YET (an earlier match this depends on hasn't been picked) -- must NOT auto-advance
  function computeRounds(round0Slots, winners){
    var rounds = [];
    var currentSlots = round0Slots.slice(); // round0 entries are only string|null, never undefined
    var roundIndex = 0;
    while(currentSlots.length >= 2){
      var matches = []; var nextSlots = [];
      for(var m=0; m<currentSlots.length/2; m++){
        var a = currentSlots[2*m], b = currentSlots[2*m+1];
        var winner;
        if(a === undefined || b === undefined){
          winner = undefined; // still waiting on an earlier match -- not a bye
        } else if(a && b === null){
          winner = a; // true structural bye
        } else if(b && a === null){
          winner = b;
        } else if(a === null && b === null){
          winner = null;
        } else {
          var picked = winners[roundIndex + "_" + m];
          winner = (picked === a || picked === b) ? picked : undefined;
        }
        matches.push({a:a,b:b,winner:winner});
        nextSlots.push(winner);
      }
      rounds.push(matches);
      if(nextSlots.length === 1) break;
      currentSlots = nextSlots;
      roundIndex++;
    }
    return rounds;
  }

  function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) state = Object.assign(state, JSON.parse(raw));
    }catch(e){}
  }

  // ---------- SETUP SCREEN ----------
  var countRow = document.getElementById("countRow");
  var teamGrid = document.getElementById("teamGrid");
  var randomToggle = document.getElementById("randomToggle");
  var startBtn = document.getElementById("startBtn");

  [4,8,12,16].forEach(function(n){
    var b = document.createElement("button");
    b.className = "count-btn" + (n === state.teamCount ? " active" : "");
    b.textContent = n + "チーム";
    b.dataset.count = n;
    b.addEventListener("click", function(){
      state.teamCount = n;
      state.teamNames = buildDefaultNames(n);
      renderSetup();
    });
    countRow.appendChild(b);
  });

  function renderSetup(){
    Array.prototype.forEach.call(countRow.children, function(btn){
      btn.classList.toggle("active", parseInt(btn.dataset.count,10) === state.teamCount);
    });
    if(!state.teamNames || state.teamNames.length !== state.teamCount){
      state.teamNames = buildDefaultNames(state.teamCount);
    }
    teamGrid.innerHTML = "";
    state.teamNames.forEach(function(name, i){
      var input = document.createElement("input");
      input.type = "text";
      input.value = name;
      input.placeholder = defaultName(i);
      input.addEventListener("input", function(){ state.teamNames[i] = input.value; });
      teamGrid.appendChild(input);
    });
  }

  startBtn.addEventListener("click", function(){
    var names = state.teamNames.map(function(n,i){ var v=(n||"").trim(); return v.length?v:defaultName(i); });
    var order = randomToggle.checked ? shuffle(names) : names;
    var bracketSize = nextPow2(state.teamCount);
    state.round0Slots = buildRound0Slots(order, bracketSize);
    state.winners = {};
    state.screen = "bracket";
    lastFlareKeys = {};
    save();
    showScreen();
  });

  // ---------- BRACKET SCREEN (vertical pyramid, panel + badge style) ----------
  var LEAF_GAP_X = 118, LEAF_PANEL_W = 92, LEAF_PANEL_H = 100, BADGE_W = 38, BADGE_H = 60,
      ROUND_GAP_Y = 170, TOP_MARGIN = 70, SIDE_PAD = 22,
      CHAMPION_ICON_H = 130, CHAMPION_ICON_W = 120; // matches champion-icon.png's own aspect ratio (not a pill, so don't reuse BADGE_W/H)

  var pyramidEl = document.getElementById("pyramid");
  var championBox = document.getElementById("champion");
  var championName = document.getElementById("championName");

  function computeLayout(bracketSize){
    var numRounds = Math.log2(bracketSize);
    var layoutX = [], layoutY = [];
    layoutX[0] = [];
    for(var i=0;i<bracketSize;i++) layoutX[0].push(SIDE_PAD + i*LEAF_GAP_X + LEAF_GAP_X/2);
    for(var L=1; L<=numRounds; L++){
      layoutX[L] = [];
      var prev = layoutX[L-1];
      for(var j=0;j<prev.length/2;j++) layoutX[L].push((prev[2*j]+prev[2*j+1])/2);
    }
    for(var L2=0; L2<=numRounds; L2++) layoutY[L2] = TOP_MARGIN + (numRounds - L2) * ROUND_GAP_Y;
    var width = SIDE_PAD*2 + bracketSize*LEAF_GAP_X;
    var height = TOP_MARGIN + numRounds*ROUND_GAP_Y + LEAF_PANEL_H/2 + 24;
    return {numRounds:numRounds, layoutX:layoutX, layoutY:layoutY, width:width, height:height};
  }

  // occupant name at level L, index i (L=0 -> round0Slots; L>=1 -> rounds[L-1][i].winner)
  function occupantAt(rounds, round0Slots, L, i){
    if(L === 0) return round0Slots[i];
    var m = rounds[L-1][i];
    return m ? m.winner : null;
  }

  // Does the subtree feeding level-L slot i contain at least one real team (vs. being a
  // permanently-empty structural bye slot)? Used to draw a clean pass-through line for byes
  // instead of a fake "match" junction with a dead-end stub.
  function branchHasRealTeam(round0Slots, bracketSize, level, idx){
    var leavesPerSlot = Math.pow(2, level);
    var start = idx * leavesPerSlot;
    for(var k=0; k<leavesPerSlot; k++){
      if(round0Slots[start+k] !== null) return true;
    }
    return false;
  }

  function isEliminated(rounds, name){
    if(!name) return false;
    for(var r=0;r<rounds.length;r++){
      for(var m=0;m<rounds[r].length;m++){
        var mt = rounds[r][m];
        if((mt.a === name || mt.b === name) && mt.winner && mt.winner !== name) return true;
      }
    }
    return false;
  }

  function connectorTopY(layout, L){
    return L === 0 ? layout.layoutY[0] - LEAF_PANEL_H/2 : layout.layoutY[L] - BADGE_H/2;
  }
  function connectorBottomY(layout, L, numRounds){
    var halfH = (L === numRounds) ? CHAMPION_ICON_H/2 : BADGE_H/2;
    return layout.layoutY[L] + halfH;
  }

  function renderBracket(){
    var bracketSize = state.round0Slots.length;
    var layout = computeLayout(bracketSize);
    var rounds = computeRounds(state.round0Slots, state.winners);
    var numRounds = layout.numRounds;

    pyramidEl.style.width = layout.width + "px";
    pyramidEl.style.height = layout.height + "px";
    pyramidEl.innerHTML = "";

    // Scale the whole pyramid down to fit the available width so large brackets
    // (12/16 teams) display in full without needing horizontal scrolling.
    var outerEl = document.getElementById("pyramidOuter");
    var availWidth = outerEl.parentElement.clientWidth || layout.width;
    var scale = Math.min(1, availWidth / layout.width);
    pyramidEl.style.transform = "scale(" + scale + ")";
    outerEl.style.width = (layout.width * scale) + "px";
    outerEl.style.height = (layout.height * scale) + "px";

    // --- SVG connector lines ---
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", layout.width);
    svg.setAttribute("height", layout.height);
    for(var L=1; L<=numRounds; L++){
      var childCount = layout.layoutX[L-1].length;
      for(var m=0; m<childCount/2; m++){
        var xC0 = layout.layoutX[L-1][2*m], xC1 = layout.layoutX[L-1][2*m+1];
        var xP = layout.layoutX[L][m];
        var yChildTop = connectorTopY(layout, L-1);
        var yParentBottom = connectorBottomY(layout, L, numRounds);
        var midY = (yChildTop + yParentBottom) / 2;

        // Figure out whether each child slot is a real (possibly still-undecided) leaf/branch,
        // or a permanently-empty structural bye slot (round0Slots entry is null there).
        var child0Real = branchHasRealTeam(state.round0Slots, bracketSize, L-1, 2*m);
        var child1Real = branchHasRealTeam(state.round0Slots, bracketSize, L-1, 2*m+1);

        var segments;
        if(child0Real && child1Real){
          segments = [[xC0,yChildTop,xC0,midY],[xC1,yChildTop,xC1,midY],[xC0,midY,xC1,midY],[xP,midY,xP,yParentBottom]];
        } else if(child0Real){
          segments = [[xC0,yChildTop,xC0,yParentBottom]]; // true bye: a single clean pass-through line, no junction box
        } else if(child1Real){
          segments = [[xC1,yChildTop,xC1,yParentBottom]];
        } else {
          segments = [];
        }
        segments.forEach(function(seg){
            var line = document.createElementNS(svgNS,"line");
            line.setAttribute("x1",seg[0]); line.setAttribute("y1",seg[1]);
            line.setAttribute("x2",seg[2]); line.setAttribute("y2",seg[3]);
            line.setAttribute("stroke","#ffffff"); line.setAttribute("stroke-width","3");
            svg.appendChild(line);
          });
      }
    }
    pyramidEl.appendChild(svg);

    var currentFlareKeys = {};

    // --- leaf panels (round 0, always-visible home panels) ---
    // A structurally-empty bye slot (no team was ever assigned here) gets no panel at all --
    // that team simply enters the bracket one round higher up, with a clean pass-through line.
    for(var i=0;i<bracketSize;i++){
      var name0 = state.round0Slots[i];
      if(!name0) continue;
      var panel = document.createElement("div");
      var x0 = layout.layoutX[0][i], y0 = layout.layoutY[0];
      panel.style.left = x0 + "px"; panel.style.top = y0 + "px";
      panel.style.width = LEAF_PANEL_W + "px"; panel.style.height = LEAF_PANEL_H + "px";
      panel.style.transform = "translate(-50%,-50%)";
      var elim0 = isEliminated(rounds, name0);
      panel.className = "leaf-panel" + (elim0 ? " eliminated" : "");
      var nameDiv = document.createElement("div");
      nameDiv.className = "lname";
      nameDiv.textContent = name0;
      panel.appendChild(nameDiv);
      pyramidEl.appendChild(panel);
    }

    // --- badges for every level (0 = identity badge inside leaf panel area, >=1 = advancement nodes) ---
    for(var L0=0; L0<=numRounds; L0++){
      var slotCount = layout.layoutX[L0].length;
      for(var idx=0; idx<slotCount; idx++){
        var name = occupantAt(rounds, state.round0Slots, L0, idx);
        if(L0 === 0 && !name) continue; // no leaf panel there either -- nothing to draw
        var x = layout.layoutX[L0][idx];
        var y;
        var w = BADGE_W, h = BADGE_H;
        var isApex = (L0 === numRounds);
        if(L0 === 0){
          y = layout.layoutY[0] + LEAF_PANEL_H/2 - h/2 - 6; // nestled near bottom of leaf panel, below the name text
        } else {
          y = layout.layoutY[L0];
        }
        if(isApex){ w = CHAMPION_ICON_W; h = CHAMPION_ICON_H; }

        var badge = document.createElement("div");
        badge.style.left = x + "px"; badge.style.top = y + "px";
        badge.style.width = w + "px"; badge.style.height = h + "px";
        if(!isApex) badge.style.borderRadius = (w/2) + "px"; // clip the per-team fill color to a pill shape to match the frame art
        badge.style.fontSize = (isApex ? 1.15 : 0.82) + "rem";
        badge.style.transform = "translate(-50%,-50%)";

        if(!name){
          badge.className = "badge placeholder";
        } else {
          var elim = isEliminated(rounds, name);
          badge.title = name;

          if(isApex){
            badge.className = "badge champion-badge" + (elim ? " eliminated" : "");
            badge.style.backgroundImage = "url(\"assets/champion-icon.png\")";
          } else {
            var homeIdx = state.round0Slots.indexOf(name);
            var hue = teamHue(homeIdx >= 0 ? homeIdx : idx, bracketSize);
            var cls = "badge";
            if(L0 === 0){
              cls += elim ? " eliminated" : "";
              badge.style.backgroundColor = elim ? "#334" : "hsla(" + hue + ",85%,72%,0.3)";
            } else {
              cls += elim ? " eliminated" : " advanced";
              badge.style.backgroundColor = elim ? "#334" : "hsla(" + hue + ",90%,75%,0.3)";
            }
            badge.className = cls;
            badge.textContent = name.charAt(0);
          }

          // click target: this occupant may still have a pending decision at round L0 (feeds match rounds[L0][floor(idx/2)])
          if(L0 < numRounds){
            var matchIndex = Math.floor(idx/2);
            var match = rounds[L0] && rounds[L0][matchIndex];
            if(match && match.a && match.b){
              badge.classList.add("clickable");
              badge.addEventListener("click", (function(rr, mm, nm){
                return function(){
                  state.winners[rr + "_" + mm] = nm;
                  save();
                  renderBracket();
                };
              })(L0, matchIndex, name));
            }
          }

          // flare newly-decided advancement badges (L>=1). The champion icon gets a plain
          // scale/fade "arrival" instead of the glow flare, since the glow's square shape
          // doesn't match its round artwork.
          if(L0 >= 1){
            var flareKey = L0 + "@" + idx + "=" + name;
            currentFlareKeys[flareKey] = true;
            if(!lastFlareKeys[flareKey]) badge.classList.add(isApex ? "champion-arrive" : "flare");
          }
        }
        pyramidEl.appendChild(badge);
      }
    }


    lastFlareKeys = currentFlareKeys;

    var champ = rounds[rounds.length-1] && rounds[rounds.length-1][0] ? rounds[rounds.length-1][0].winner : null;
    if(champ){
      championBox.style.display = "flex";
      championName.textContent = champ;
    } else {
      championBox.style.display = "none";
    }
  }

  document.getElementById("logoResetBtn").addEventListener("click", function(){
    if(state.screen !== "bracket") return; // nothing to reset from the setup screen
    if(!confirm("チーム数・チーム名の設定からやり直します。よろしいですか？")) return;
    state.screen = "setup";
    state.round0Slots = [];
    state.winners = {};
    lastFlareKeys = {};
    save();
    showScreen();
  });

  function showScreen(){
    if(state.screen === "bracket" && state.round0Slots && state.round0Slots.length){
      document.getElementById("setupScreen").style.display = "none";
      document.getElementById("bracketScreen").style.display = "block";
      renderBracket();
    } else {
      document.getElementById("setupScreen").style.display = "block";
      document.getElementById("bracketScreen").style.display = "none";
      renderSetup();
    }
  }

  window.addEventListener("resize", function(){
    if(state.screen === "bracket" && state.round0Slots && state.round0Slots.length) renderBracket();
  });

  load();
  if(!state.teamNames || !state.teamNames.length) state.teamNames = buildDefaultNames(state.teamCount);
  showScreen();
})();
</script>
</body>
</html>
